name: Beta Signup Email

on:
  repository_dispatch:
    types: [beta-signup]

jobs:
  send-email:
    name: Send signup notification via Resend
    runs-on: ubuntu-latest

    steps:
      - name: Send email
        run: |
          EMAIL="${{ github.event.client_payload.email }}"
          TIMESTAMP="${{ github.event.client_payload.timestamp }}"

          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Syncberg <onboarding@resend.dev>\",
              \"to\": [\"support@syncberg.com\"],
              \"subject\": \"🎉 New Beta Signup — ${EMAIL}\",
              \"html\": \"<div style='font-family:Inter,sans-serif;max-width:560px;margin:0 auto;padding:32px;background:#f5f2ec;border-radius:12px;'><h2 style='color:#161b2e;margin:0 0 8px;'>New Beta Signup</h2><p style='color:#5a6070;margin:0 0 24px;'>Someone just joined the Syncberg beta waitlist.</p><table style='width:100%;border-collapse:collapse;'><tr><td style='padding:10px 0;color:#6b7280;font-size:14px;'>Email</td><td style='padding:10px 0;color:#161b2e;font-weight:600;font-size:14px;'>${EMAIL}</td></tr><tr><td style='padding:10px 0;color:#6b7280;font-size:14px;'>Time</td><td style='padding:10px 0;color:#161b2e;font-size:14px;'>${TIMESTAMP}</td></tr></table><hr style='border:none;border-top:1px solid #e2e0da;margin:24px 0;'/><p style='color:#9ca3af;font-size:12px;margin:0;'>Sent automatically by Syncberg beta signup form via GitHub Actions.</p></div>\"
            }"
