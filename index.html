<!DOCTYPE html>
<html lang="en" class="dark">

  <title>Syncberg</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

            background: '#0a0a0a',

      },
    };

    <div class="space-x-4">
      <a href="#" class="px-6 py-2 bg-primary text-white rounded-full hover:bg-primary/80 transition">Join Beta</a>

<script src="https://cdn.tailwindcss.com"></script>

</html>
